<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width">
        <link rel="stylesheet" href="style.css">
        <title>The Alchemical Gazette</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Special+Elite&family=EB+Garamond:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">"
    </head>
    <body>
        <!-- Newspaper box-->
        <main class="newspaper-box">
            <!-- Newspaper header (Masthead) -->
            <header class="news-header">
                <div class="news-meta">
                    <span>VOL. XIII - NO. 404</span>
                    <span>THE DAILY PLAGUE</span>
                    <span>PRICE: ONE SOUL</span>
                </div>
                <h1 class="news-title">The Alchemical Gazette</h1>
                <div class "news-subbanner">
                    <span>SPECIAL EDITION: THE DIGITAL REALM</span>
                </div>
            </header>
        </main>
         
    </body>
</html>
